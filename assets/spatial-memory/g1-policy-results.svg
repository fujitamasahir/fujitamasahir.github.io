<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-labelledby="title desc">
<title id="title">Goal completion by observation policy over 72 matched episodes each</title>
<desc id="desc">Static 32 of 72, Periodic 67 of 72, Age 57 of 72, and Uncertainty 58 of 72. Average observations are respectively 1.00, 11.08, 11.56, and 7.19.</desc>
<rect width="960" height="495" fill="white"/>
<text x="42" y="48" font-family="Arial" font-size="23" font-weight="bold" fill="#222">G1 navigation · goal completion</text>
<text x="42" y="75" font-family="Arial" font-size="16" fill="#697581">36 fit worlds × 2 schedules per method · common cap of 20 observations</text>
<text x="725" y="102" font-family="Arial" font-size="14" fill="#66737e">Success</text><text x="844" y="102" font-family="Arial" font-size="14" fill="#66737e">Mean obs.</text>
<text x="42" y="143" font-family="Arial" font-size="22" fill="#283444">Static</text><rect x="218" y="122" width="490" height="31" rx="4" fill="#f0f2f4"/><rect x="218" y="122" width="217.78" height="31" rx="4" fill="#7892a8"/><text x="725" y="144" font-family="Arial" font-size="21" font-weight="bold" fill="#283444">32/72</text><text x="844" y="144" font-family="Arial" font-size="18" fill="#66737e">1.00</text>
<text x="42" y="223" font-family="Arial" font-size="22" fill="#283444">Periodic</text><rect x="218" y="202" width="490" height="31" rx="4" fill="#f0f2f4"/><rect x="218" y="202" width="455.97" height="31" rx="4" fill="#1772d0"/><text x="725" y="224" font-family="Arial" font-size="21" font-weight="bold" fill="#283444">67/72</text><text x="844" y="224" font-family="Arial" font-size="18" fill="#66737e">11.08</text>
<text x="42" y="303" font-family="Arial" font-size="22" fill="#283444">Age</text><rect x="218" y="282" width="490" height="31" rx="4" fill="#f0f2f4"/><rect x="218" y="282" width="387.92" height="31" rx="4" fill="#7892a8"/><text x="725" y="304" font-family="Arial" font-size="21" font-weight="bold" fill="#283444">57/72</text><text x="844" y="304" font-family="Arial" font-size="18" fill="#66737e">11.56</text>
<text x="42" y="383" font-family="Arial" font-size="22" fill="#283444">Uncertainty</text><rect x="218" y="362" width="490" height="31" rx="4" fill="#f0f2f4"/><rect x="218" y="362" width="394.72" height="31" rx="4" fill="#7892a8"/><text x="725" y="384" font-family="Arial" font-size="21" font-weight="bold" fill="#283444">58/72</text><text x="844" y="384" font-family="Arial" font-size="18" fill="#66737e">7.19</text>
<line x1="42" y1="453" x2="914" y2="453" stroke="#dfe3e6"/>
<text x="42" y="478" font-family="Arial" font-size="14" fill="#687582">Goal reached, not necessarily contact-free; the Periodic method had one contact-involved completion.</text>
