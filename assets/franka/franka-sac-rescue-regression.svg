<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" width="960" height="418" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">SAC rescue versus regression counts</title><desc id="chart-desc">Seed42 rescues 9 BC failures and causes 12 regressions; seed123 rescues 10 and causes 18; seed456 rescues 22 and causes 4, on the same 1000 held-out positions.</desc><rect width="960" height="418" fill="#fff"/><text x="38" y="39" font-size="23" fill="#253449" font-weight="600" >Where residual SAC helped and hurt</text><text x="38" y="64" font-size="14" fill="#667085" font-weight="400" >Matched outcomes against BC · held-out 1,000 positions per SAC training seed</text><rect x="245" y="83" width="13" height="13" rx="3" fill="#c07832"/><text x="266" y="95" font-size="14" fill="#667085" font-weight="400" >BC success lost (regression)</text><rect x="538" y="83" width="13" height="13" rx="3" fill="#278a75"/><text x="559" y="95" font-size="14" fill="#667085" font-weight="400" >BC failure rescued</text><line x1="245" y1="119" x2="245" y2="341" stroke="#e7ebef" stroke-width="1" /><text x="245" y="365" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">20</text><line x1="365" y1="119" x2="365" y2="341" stroke="#e7ebef" stroke-width="1" /><text x="365" y="365" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">10</text><line x1="485" y1="119" x2="485" y2="341" stroke="#98a2b3" stroke-width="2" /><text x="485" y="365" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">0</text><line x1="605" y1="119" x2="605" y2="341" stroke="#e7ebef" stroke-width="1" /><text x="605" y="365" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">10</text><line x1="725" y1="119" x2="725" y2="341" stroke="#e7ebef" stroke-width="1" /><text x="725" y="365" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">20</text><text x="40" y="162" font-size="17" fill="#253449" font-weight="400" >C / Seed 42</text><rect x="341" y="142" width="144" height="30" rx="4" fill="#c07832"/><rect x="485" y="142" width="108" height="30" rx="4" fill="#278a75"/><text x="328" y="162" font-size="16" fill="#c07832" font-weight="600" text-anchor="end">12</text><text x="606" y="162" font-size="16" fill="#278a75" font-weight="600" >9</text><text x="40" y="247" font-size="17" fill="#253449" font-weight="400" >C / Seed 123</text><rect x="269" y="227" width="216" height="30" rx="4" fill="#c07832"/><rect x="485" y="227" width="120" height="30" rx="4" fill="#278a75"/><text x="256" y="247" font-size="16" fill="#c07832" font-weight="600" text-anchor="end">18</text><text x="618" y="247" font-size="16" fill="#278a75" font-weight="600" >10</text><text x="40" y="332" font-size="17" fill="#253449" font-weight="600" >C / Seed 456</text><rect x="437" y="312" width="48" height="30" rx="4" fill="#c07832"/><rect x="485" y="312" width="264" height="30" rx="4" fill="#278a75"/><text x="424" y="332" font-size="16" fill="#c07832" font-weight="600" text-anchor="end">4</text><text x="762" y="332" font-size="16" fill="#278a75" font-weight="600" >22</text><text x="484" y="395" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">Number of evaluation positions (left = regression, right = rescue)</text></svg>
