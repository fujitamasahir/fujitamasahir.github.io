<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 386" width="960" height="386" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Final held-out SAC evaluation</title><desc id="chart-desc">On 1000 new matched cube positions, BC succeeds 93.9 percent, C seed 42 93.6 percent, seed 123 93.1 percent, seed 456 95.7 percent.</desc><rect width="960" height="386" fill="#fff"/><text x="38" y="39" font-size="23" fill="#253449" font-weight="600" >Held-out test: 1,000 new cube positions</text><text x="38" y="64" font-size="14" fill="#667085" font-weight="400" >Independent evaluation seeds 130000–130999 · C (Hard + Shaped) versus fixed BC</text><line x1="270" y1="105" x2="270" y2="309" stroke="#e7ebef" stroke-width="1" /><line x1="413.5" y1="105" x2="413.5" y2="309" stroke="#e7ebef" stroke-width="1" /><line x1="557" y1="105" x2="557" y2="309" stroke="#e7ebef" stroke-width="1" /><line x1="700.5" y1="105" x2="700.5" y2="309" stroke="#e7ebef" stroke-width="1" /><line x1="844" y1="105" x2="844" y2="309" stroke="#e7ebef" stroke-width="1" /><line x1="549.8250000000004" y1="101" x2="549.8250000000004" y2="311" stroke="#9ba5b0" stroke-width="2" stroke-dasharray="5 5"/><text x="42" y="135" font-size="16" fill="#253449" font-weight="400" >BC only</text><line x1="270" y1="130" x2="549.8250000000004" y2="130" stroke="#9ba5b0" stroke-width="3" /><circle cx="549.8250000000004" cy="130" r="9" fill="#9ba5b0" stroke="white" stroke-width="2"/><text x="564.8250000000004" y="135" font-size="15" fill="#253449" font-weight="600" >93.9%</text><text x="42" y="189" font-size="16" fill="#253449" font-weight="400" >C / Seed 42</text><line x1="270" y1="184" x2="528.2999999999996" y2="184" stroke="#1772d0" stroke-width="3" /><circle cx="528.2999999999996" cy="184" r="9" fill="#1772d0" stroke="white" stroke-width="2"/><text x="543.2999999999996" y="189" font-size="15" fill="#253449" font-weight="600" >93.6%</text><text x="42" y="243" font-size="16" fill="#253449" font-weight="400" >C / Seed 123</text><line x1="270" y1="238" x2="492.4249999999996" y2="238" stroke="#278a75" stroke-width="3" /><circle cx="492.4249999999996" cy="238" r="9" fill="#278a75" stroke="white" stroke-width="2"/><text x="507.4249999999996" y="243" font-size="15" fill="#253449" font-weight="600" >93.1%</text><text x="42" y="297" font-size="16" fill="#253449" font-weight="600" >C / Seed 456</text><line x1="270" y1="292" x2="678.9750000000001" y2="292" stroke="#c07832" stroke-width="3" /><circle cx="678.9750000000001" cy="292" r="9" fill="#c07832" stroke="white" stroke-width="2"/><text x="693.9750000000001" y="297" font-size="15" fill="#253449" font-weight="600" >95.7%</text><line x1="270" y1="319" x2="844" y2="319" stroke="#b8c1cc" stroke-width="1" /><line x1="270" y1="315" x2="270" y2="323" stroke="#b8c1cc" stroke-width="1" /><text x="270" y="343" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">90%</text><line x1="413.5" y1="315" x2="413.5" y2="323" stroke="#b8c1cc" stroke-width="1" /><text x="413.5" y="343" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">92%</text><line x1="557" y1="315" x2="557" y2="323" stroke="#b8c1cc" stroke-width="1" /><text x="557" y="343" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">94%</text><line x1="700.5" y1="315" x2="700.5" y2="323" stroke="#b8c1cc" stroke-width="1" /><text x="700.5" y="343" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">96%</text><line x1="844" y1="315" x2="844" y2="323" stroke="#b8c1cc" stroke-width="1" /><text x="844" y="343" font-size="13" fill="#667085" font-weight="400" text-anchor="middle">98%</text><text x="270" y="364" font-size="12" fill="#667085" font-weight="400" >Dashed line: BC baseline · Horizontal axis starts at 90% to show small differences</text></svg>
