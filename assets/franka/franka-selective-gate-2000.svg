<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" width="960" height="415" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Selective residual SAC: success on 2,000 new cube positions</title><desc id="chart-desc">Fixed BC baseline 92.95 percent; always-on SAC 94.95 percent; safety gate 94.20 percent; balanced gate 95.10 percent. Gates were calibrated on different positions and evaluated on 2,000 previously unused positions. Results use SAC training seed 456.</desc><rect width="960" height="415" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="39" font-size="23" fill="#253449" font-weight="600">Selective SAC: 2,000 new test positions</text><text x="38" y="65" font-size="14" fill="#667085">Frozen gates · C / SAC seed 456 · evaluation seeds 150000–151999</text><line x1="300.00" y1="108" x2="300.00" y2="337" stroke="#e7ebef"/><text x="300.00" y="362" font-size="14" fill="#667085" text-anchor="middle">90%</text><line x1="463.08" y1="108" x2="463.08" y2="337" stroke="#e7ebef"/><text x="463.08" y="362" font-size="14" fill="#667085" text-anchor="middle">92%</text><line x1="626.15" y1="108" x2="626.15" y2="337" stroke="#e7ebef"/><text x="626.15" y="362" font-size="14" fill="#667085" text-anchor="middle">94%</text><line x1="789.23" y1="108" x2="789.23" y2="337" stroke="#e7ebef"/><text x="789.23" y="362" font-size="14" fill="#667085" text-anchor="middle">96%</text><line x1="540.54" y1="107" x2="540.54" y2="337" stroke="#9ba5b0" stroke-width="2" stroke-dasharray="5 5"/><text x="40" y="144" font-size="17" fill="#253449" font-weight="400">BC only</text><line x1="300" y1="139" x2="540.54" y2="139" stroke="#9ba5b0" stroke-width="4" stroke-linecap="round"/><circle cx="540.54" cy="139" r="9" fill="#9ba5b0" stroke="#fff" stroke-width="2"/><text x="556.54" y="144" font-size="17" font-weight="600" fill="#253449">92.95%</text><text x="40" y="204" font-size="17" fill="#253449" font-weight="400">Always BC + SAC</text><line x1="300" y1="199" x2="703.62" y2="199" stroke="#1772d0" stroke-width="4" stroke-linecap="round"/><circle cx="703.62" cy="199" r="9" fill="#1772d0" stroke="#fff" stroke-width="2"/><text x="719.62" y="204" font-size="17" font-weight="600" fill="#253449">94.95%</text><text x="40" y="264" font-size="17" fill="#253449" font-weight="400">Safety gate</text><line x1="300" y1="259" x2="642.46" y2="259" stroke="#278a75" stroke-width="4" stroke-linecap="round"/><circle cx="642.46" cy="259" r="9" fill="#278a75" stroke="#fff" stroke-width="2"/><text x="658.46" y="264" font-size="17" font-weight="600" fill="#253449">94.20%</text><text x="40" y="324" font-size="17" fill="#253449" font-weight="600">Balanced gate</text><line x1="300" y1="319" x2="715.85" y2="319" stroke="#c07832" stroke-width="4" stroke-linecap="round"/><circle cx="715.85" cy="319" r="9" fill="#c07832" stroke="#fff" stroke-width="2"/><text x="731.85" y="324" font-size="17" font-weight="600" fill="#253449">95.10%</text><line x1="300" y1="336" x2="830" y2="336" stroke="#b8c1cc"/><text x="300" y="388" font-size="13" fill="#667085">Dashed line: BC baseline · Axis starts at 90% to show small differences</text></g></svg>